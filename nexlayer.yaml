application:
  name: affine
  pods:
  - name: graphql
    # Re-pushed from ghcr.io/toeverything/affine:stable. The old -graphql package is
    # no longer anonymously pullable; the consolidated affine image replaces it.
    image: registry.nexlayer.io/user_01kece1xyh817dwff7wnarhkxd/affine:stable
    path: /
    # Run the self-host DB migration (requires pgvector) before booting the server.
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js && node ./dist/main.js"]
    servicePorts:
    - 3010
    vars:
      NODE_ENV: production
      DATABASE_URL: postgres://affine:affine@postgres.pod:5432/affine
      REDIS_SERVER_HOST: redis.pod
      AFFINE_SERVER_HTTPS: "true"
      AFFINE_SERVER_PORT: "3010"
      AFFINE_SERVER_HOST: "relaxed-weasel-affine.cloud.nexlayer.ai"
      AFFINE_SERVER_EXTERNAL_URL: "https://relaxed-weasel-affine.cloud.nexlayer.ai"
      AFFINE_TELEMETRY_ENABLE: "false"
  - name: postgres
    # AFFiNE requires the pgvector extension — plain postgres fails the migration.
    image: mirror.gcr.io/pgvector/pgvector:pg16
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: affine
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: affine
    volumes:
    - name: affine-db
      mountPath: /var/lib/postgresql
      size: 10Gi
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
